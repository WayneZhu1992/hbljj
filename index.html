<header class="topbar"><div class="logo" aria-hidden="true"></div><h1>湖北省可信数据空间通用连接器</h1><div class="connector"><svg><use href="#network"/></svg>当前连接器：湖北大数据集团…</div><div class="topright"><svg><use href="#home"/></svg><svg><use href="#info"/></svg><div class="user"><div class="avatar"><svg><use href="#user"/></svg></div>管理员 <span style="color:#a0aaba;font-size:10px">▼</span></div></div></header>

<main class="main"><div class="tabs"><span class="tab-home"><svg><use href="#desktop"/></svg>工作台</span><span class="tab-active">安全保障能力 <span style="font-size:16px;font-weight:400;opacity:.75">×</span></span></div><div class="content"><div class="breadcrumb">系统管理 <span>/</span> <strong>安全保障能力</strong></div><section class="overview"><div class="overview-icon"><svg><use href="#shield"/></svg></div><div><h2>安全保障能力</h2><p>构建覆盖身份鉴别、访问控制、数据全生命周期与用户信息的安全防护体系。<br>通过统一安全控制，保障连接器间数据交互与使用过程的安全。</p></div><div class="overview-right"><div><div class="status-total"><strong id="enabled-count">4</strong><small>/ 4</small></div><div class="status-text">已启用安全模块</div></div><span class="status-pill" id="overall-status">全部已启用</span></div></section>
<div class="grid" id="modules"></div></div></main></div><div class="toast" role="status" aria-live="polite" id="toast" hidden></div>
<script>
const modules=[
{id:'identity',title:'标识和鉴别安全',en:'IDENTITY & AUTHENTICATION',icon:'user',desc:'作为连接器间数据交互的核心安全基础，通过双向身份验证、多因素认证与存储完整性保护，为身份认证和权限管控提供可靠的数据基础。',tags:['双向身份验证','用户多因素认证','存储完整性'],steps:[['network','连接器接入'],['user','双向身份验证'],['key','多因素认证'],['check','可信身份确认']]},
{id:'access',title:'访问控制安全',en:'ACCESS CONTROL',icon:'shield',desc:'基于用户职责划定功能与数据的访问范围，结合权限控制、网络控制与网络安全防护，防止越权操作，保障系统运行安全、规范。',tags:['权限控制','网络控制','网络安全'],steps:[['send','发起访问请求'],['user','匹配用户权限'],['shield','网络安全校验'],['check','授权访问资源']]},
{id:'data',title:'数据安全',en:'DATA SECURITY',icon:'database',desc:'覆盖数据传输、存储、访问、加工、使用与删除全生命周期，通过安全防护防止数据被非法访问、窃取或泄露，保障数据使用与流转符合安全合规要求。',tags:['防非法访问','防窃取泄露','全生命周期保护'],steps:[['send','传输'],['database','存储'],['key','访问'],['process','加工'],['file','使用'],['trash','删除']]},
{id:'personal',title:'用户信息安全',en:'USER INFORMATION PROTECTION',icon:'lock',desc:'通过加密存储与访问限制保护用户信息，防止信息泄露、被窃取或非法使用；加强非授权访问管理，保障用户信息安全与个人隐私权益。',tags:['信息加密存储','访问权限限制','非授权访问管理'],steps:[['user','用户信息录入'],['lock','信息加密存储'],['key','访问授权校验'],['shield','阻断非授权访问']]}
];
const svg=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;let states={};try{states=JSON.parse(localStorage.getItem('connector-security-demo-v1')||'{}')}catch(e){}for(const m of modules){if(typeof states[m.id]!=='boolean')states[m.id]=true}
function render(){document.getElementById('modules').innerHTML=modules.map((m,i)=>`<section class="card ${states[m.id]?'':'off'}" aria-labelledby="title-${m.id}"><div class="card-head"><div class="icon-box">${svg(m.icon)}</div><div><h3 id="title-${m.id}">${m.title}</h3></div><span class="module-number">0${i+1}</span></div><p class="desc">${m.desc}</p><div class="capabilities">${m.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="process-title">${m.id==='data'?'全生命周期防护流程':'安全保障流程'}</div><div class="flow" aria-label="${m.title}流程">${m.steps.map(([ic,t],j)=>`${j?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="step">${svg(ic)}<span>${t}</span></div>`).join('')}</div><div class="controls"><span class="control-label">${svg('settings')}安全控制</span><span class="control-state">${states[m.id]?'已启用':'已关闭'}</span><button class="switch" role="switch" aria-checked="${states[m.id]}" aria-label="${m.title}安全控制" data-id="${m.id}"></button></div></section>`).join('');updateSummary()}
function updateSummary(){const n=modules.filter(m=>states[m.id]).length;document.getElementById('enabled-count').textContent=n;const badge=document.getElementById('overall-status');badge.textContent=n===4?'全部已启用':n===0?'全部已关闭':`${4-n} 项未启用`;badge.style.color=n===4?'#249e7d':'#929bad';badge.style.background=n===4?'#edf9f5':'#f5f7fa';badge.style.borderColor=n===4?'#d8f0e7':'#e8edf4'}
let timer;document.getElementById('modules').addEventListener('click',e=>{const btn=e.target.closest('button[data-id]');if(!btn)return;const id=btn.dataset.id;states[id]=!states[id];try{localStorage.setItem('connector-security-demo-v1',JSON.stringify(states))}catch(e){}btn.setAttribute('aria-checked',states[id]);const card=btn.closest('.card');card.classList.toggle('off',!states[id]);card.querySelector('.control-state').textContent=states[id]?'已启用':'已关闭';updateSummary();const toast=document.getElementById('toast');toast.innerHTML=`${svg('check')}${modules.find(m=>m.id===id).title}已${states[id]?'启用':'关闭'}`;toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,2300)});render();
</script></body></html>
